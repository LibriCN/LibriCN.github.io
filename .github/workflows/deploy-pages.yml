name: Deploy Livro Perto no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar build estático
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_CITY_NAME: ${{ vars.VITE_CITY_NAME }}
          VITE_CITY_SYMBOL: ${{ vars.VITE_CITY_SYMBOL }}
          VITE_ADMIN_PATH: ${{ vars.VITE_ADMIN_PATH }}
      - name: Permitir rotas diretas no GitHub Pages
        run: cp dist/index.html dist/404.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
